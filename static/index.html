<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Qualifier — Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div>
                <h1 class="text-lg font-bold tracking-tight">Lead Qualifier</h1>
                <p class="text-slate-400 text-xs mt-0.5">Inbound lead qualification — live demo</p>
            </div>
            <div class="hidden sm:flex gap-2">
                <span class="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded">Gemini Flash</span>
                <span class="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded">Qdrant</span>
                <span class="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded">Google Sheets</span>
                <span class="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded">Slack</span>
            </div>
        </div>
    </header>

    <!-- Main layout -->
    <main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">

        <!-- ── LEFT: Form ─────────────────────────────────────────────────── -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">

            <!-- Scenario presets -->
            <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-3">Test Scenarios</h2>
            <div class="grid grid-cols-2 gap-2 mb-6">
                <button onclick="loadScenario('high_intent')"
                        class="text-left p-3 rounded-lg border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 transition-colors">
                    <div class="font-semibold text-emerald-800 text-sm">🏢 High Intent</div>
                    <div class="text-emerald-600 text-xs mt-0.5">Full details, clear budget</div>
                </button>
                <button onclick="loadScenario('missing_message')"
                        class="text-left p-3 rounded-lg border border-red-200 bg-red-50 hover:bg-red-100 transition-colors">
                    <div class="font-semibold text-red-800 text-sm">⚠️ Missing Message</div>
                    <div class="text-red-600 text-xs mt-0.5">Triggers validation failure</div>
                </button>
                <button onclick="loadScenario('low_context')"
                        class="text-left p-3 rounded-lg border border-sky-200 bg-sky-50 hover:bg-sky-100 transition-colors">
                    <div class="font-semibold text-sky-800 text-sm">💬 Low Context</div>
                    <div class="text-sky-600 text-xs mt-0.5">Short message, skips AI</div>
                </button>
                <button onclick="loadScenario('spam')"
                        class="text-left p-3 rounded-lg border border-amber-200 bg-amber-50 hover:bg-amber-100 transition-colors">
                    <div class="font-semibold text-amber-800 text-sm">🎓 Spam / Student</div>
                    <div class="text-amber-600 text-xs mt-0.5">Low score, red flags</div>
                </button>
            </div>

            <hr class="border-slate-200 mb-6">

            <!-- Contact form -->
            <form id="lead-form" onsubmit="submitLead(event)" novalidate>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                            Full Name <span class="text-red-400">*</span>
                        </label>
                        <input id="full_name" type="text"
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                            Email <span class="text-red-400">*</span>
                        </label>
                        <input id="email" type="email"
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Company</label>
                        <input id="company_name" type="text"
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Job Title</label>
                        <input id="job_title" type="text"
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Company Size</label>
                        <select id="company_size"
                                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="">— select —</option>
                            <option value="1-10">1–10</option>
                            <option value="11-50">11–50</option>
                            <option value="51-200">51–200</option>
                            <option value="201-500">201–500</option>
                            <option value="500+">500+</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Budget Range</label>
                        <select id="budget_range"
                                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="">— select —</option>
                            <option value="<$1k/mo">&lt;$1k/mo</option>
                            <option value="$1k-$5k/mo">$1k–$5k/mo</option>
                            <option value="$5k-$15k/mo">$5k–$15k/mo</option>
                            <option value="$15k-$50k/mo">$15k–$50k/mo</option>
                            <option value="$50k+/mo">$50k+/mo</option>
                        </select>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1">
                        Message <span class="text-red-400">*</span>
                    </label>
                    <textarea id="message" rows="4" oninput="updateCharCount()"
                              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                              placeholder="Tell us about your needs…"></textarea>
                    <div class="flex justify-between mt-1">
                        <span id="length-hint" class="text-xs text-slate-400"></span>
                        <span id="char-count" class="text-xs text-slate-400">0 chars</span>
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm">
                    Submit Lead →
                </button>
            </form>
        </div>

        <!-- ── RIGHT: Result panel ────────────────────────────────────────── -->
        <div id="result-panel" class="lg:sticky lg:top-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 flex flex-col items-center justify-center text-center min-h-64">
                <div class="text-5xl mb-4 opacity-20">⚡</div>
                <p class="text-slate-500 font-medium">Submit a lead to see the AI analysis</p>
                <p class="text-slate-400 text-sm mt-1">Pick a scenario above or fill in the form</p>
            </div>
        </div>

    </main>

    <script>
        // ── Scenario presets ──────────────────────────────────────────────────

        const SCENARIOS = {
            high_intent: {
                full_name: 'Jordan Ellis',
                email: 'jordan.ellis@examplecorp.com',
                company_name: 'Example Corp',
                job_title: 'Operations Manager',
                company_size: '11-50',
                budget_range: '$5k-$15k/mo',
                message: 'We are drowning in manual data entry across three different tools and need to automate onboarding before headcount doubles next quarter.'
            },
            missing_message: {
                full_name: 'Sam Rivera',
                email: 'sam@company.com',
                company_name: 'Company',
                job_title: '',
                company_size: '',
                budget_range: '',
                message: ''
            },
            low_context: {
                full_name: 'Alex Kim',
                email: 'alex@startup.io',
                company_name: 'Startup',
                job_title: '',
                company_size: '',
                budget_range: '',
                message: 'hi'
            },
            spam: {
                full_name: 'John Student',
                email: 'john@university.edu',
                company_name: 'State University',
                job_title: 'Student',
                company_size: '',
                budget_range: '',
                message: 'Hi I am doing a school project on automation tools can you share your pricing for my research paper thanks'
            }
        };

        function loadScenario(name) {
            const s = SCENARIOS[name];
            document.getElementById('full_name').value    = s.full_name;
            document.getElementById('email').value        = s.email;
            document.getElementById('company_name').value = s.company_name;
            document.getElementById('job_title').value    = s.job_title;
            document.getElementById('company_size').value = s.company_size;
            document.getElementById('budget_range').value = s.budget_range;
            document.getElementById('message').value      = s.message;
            updateCharCount();
        }

        // ── Character counter + length hint ──────────────────────────────────

        function updateCharCount() {
            const message = document.getElementById('message').value;
            const count   = message.length;
            const countEl = document.getElementById('char-count');
            const hintEl  = document.getElementById('length-hint');

            countEl.textContent = `${count} chars`;

            if (count === 0) {
                hintEl.textContent  = '';
                hintEl.className    = 'text-xs';
            } else if (count < 10) {
                hintEl.textContent  = '⚠ Under 10 chars — AI scoring will be skipped';
                hintEl.className    = 'text-xs text-amber-500';
            } else {
                hintEl.textContent  = '✓ Long enough for AI scoring';
                hintEl.className    = 'text-xs text-emerald-500';
            }
        }

        // ── Form submission ───────────────────────────────────────────────────

        async function submitLead(event) {
            event.preventDefault();

            const btn = document.getElementById('submit-btn');
            btn.disabled    = true;
            btn.textContent = 'Analyzing…';
            showLoadingState();

            const payload = {
                full_name:    document.getElementById('full_name').value,
                email:        document.getElementById('email').value,
                company_name: document.getElementById('company_name').value,
                job_title:    document.getElementById('job_title').value,
                company_size: document.getElementById('company_size').value,
                budget_range: document.getElementById('budget_range').value,
                message:      document.getElementById('message').value,
            };

            try {
                const response = await fetch('/webhook/lead', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await response.json();
                renderResult(data, response.status);
            } catch (err) {
                renderNetworkError(err.message);
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Submit Lead →';
            }
        }

        // ── Loading state ─────────────────────────────────────────────────────

        function showLoadingState() {
            document.getElementById('result-panel').innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 flex flex-col items-center justify-center min-h-64">
                    <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                    <p class="text-slate-500 text-sm">Running pipeline…</p>
                </div>`;
        }

        // ── Tier styling config ───────────────────────────────────────────────

        const TIER_CONFIG = {
            'Hot':           { emoji: '🔥', bg: 'bg-red-50',    border: 'border-red-200',    text: 'text-red-700',    bar: 'bg-red-500'    },
            'Warm':          { emoji: '⚡', bg: 'bg-amber-50',  border: 'border-amber-200',  text: 'text-amber-700',  bar: 'bg-amber-400'  },
            'Cold':          { emoji: '❄️', bg: 'bg-sky-50',    border: 'border-sky-200',    text: 'text-sky-700',    bar: 'bg-sky-400'    },
            'Manual Review': { emoji: '⚠️', bg: 'bg-slate-50',  border: 'border-slate-200',  text: 'text-slate-600',  bar: 'bg-slate-400'  },
        };

        // ── Pipeline trace ────────────────────────────────────────────────────

        function getPipelineStages(status) {
            if (status === 400 || status === 'invalid') {
                return [
                    { label: 'Validate',      state: 'fail'    },
                    { label: 'Normalize',     state: 'skip'    },
                    { label: 'Length Check',  state: 'skip'    },
                    { label: 'Vector Lookup', state: 'skip'    },
                    { label: 'AI Score',      state: 'skip'    },
                    { label: 'Sheets + Slack',state: 'skip'    },
                ];
            }
            if (status === 'low_context') {
                return [
                    { label: 'Validate',      state: 'pass'    },
                    { label: 'Normalize',     state: 'pass'    },
                    { label: 'Length Check',  state: 'fail'    },
                    { label: 'Vector Lookup', state: 'skip'    },
                    { label: 'AI Score',      state: 'skip'    },
                    { label: 'Sheets + Slack',state: 'partial' },
                ];
            }
            return [
                { label: 'Validate',      state: 'pass' },
                { label: 'Normalize',     state: 'pass' },
                { label: 'Length Check',  state: 'pass' },
                { label: 'Vector Lookup', state: 'pass' },
                { label: 'AI Score',      state: 'pass' },
                { label: 'Sheets + Slack',state: 'pass' },
            ];
        }

        function renderPipelineTrace(stages) {
            const styles = {
                pass:    { dot: 'bg-emerald-500', label: 'text-emerald-700', icon: '✓', line: 'bg-emerald-300' },
                fail:    { dot: 'bg-red-500',     label: 'text-red-600',     icon: '✗', line: 'bg-slate-200'   },
                skip:    { dot: 'bg-slate-200',   label: 'text-slate-400',   icon: '—', line: 'bg-slate-200'   },
                partial: { dot: 'bg-amber-400',   label: 'text-amber-600',   icon: '~', line: 'bg-slate-200'   },
            };

            const items = stages.map((stage, i) => {
                const s          = styles[stage.state];
                const connector  = i < stages.length - 1
                    ? `<div class="flex-1 h-px ${s.line} mx-1 mt-3 shrink"></div>`
                    : '';
                return `
                    <div class="flex flex-col items-center shrink-0">
                        <div class="w-6 h-6 rounded-full ${s.dot} flex items-center justify-center text-white text-xs font-bold shrink-0">${stage.state === 'fail' ? '✗' : stage.state === 'skip' ? '—' : stage.state === 'partial' ? '~' : '✓'}</div>
                        <div class="text-xs ${s.label} mt-1 text-center leading-tight w-12">${stage.label}</div>
                    </div>
                    ${connector}`;
            }).join('');

            return `<div class="flex items-start mb-5 overflow-x-auto">${items}</div>`;
        }

        // ── HTML escape helper (prevents XSS from AI-generated content) ───────

        function esc(value) {
            const div       = document.createElement('div');
            div.textContent = String(value ?? '');
            return div.innerHTML;
        }

        // ── Main result renderer ──────────────────────────────────────────────

        function renderResult(data, httpStatus) {
            const panel = document.getElementById('result-panel');

            // Validation failure (HTTP 400)
            if (httpStatus === 400) {
                panel.innerHTML = `
                    <div class="bg-white rounded-xl shadow-sm border border-red-200 p-6">
                        ${renderPipelineTrace(getPipelineStages(400))}
                        <div class="bg-red-50 border border-red-200 rounded-lg p-4 flex gap-3 items-start">
                            <span class="text-xl mt-0.5">⚠️</span>
                            <div>
                                <div class="font-semibold text-red-800 text-sm">Validation Failed</div>
                                <div class="text-red-600 text-sm mt-1">${esc(data.detail)}</div>
                            </div>
                        </div>
                        <p class="text-xs text-slate-400 text-center mt-4">Lead rejected before any AI or storage step ran.</p>
                    </div>`;
                return;
            }

            const tier  = data.priority_tier ?? 'Manual Review';
            const cfg   = TIER_CONFIG[tier] ?? TIER_CONFIG['Manual Review'];
            const score = Math.max(0, Math.min(100, data.lead_score ?? 0));

            const redFlagsHtml = data.red_flags && data.red_flags.length > 0
                ? `<div>
                       <div class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-2">Red Flags</div>
                       <div class="flex flex-wrap gap-2">
                           ${data.red_flags.map(f => `<span class="bg-red-100 text-red-700 text-xs px-2.5 py-1 rounded-full">${esc(f)}</span>`).join('')}
                       </div>
                   </div>`
                : '';

            const badges = [
                data.prior_context_used
                    ? '<span class="bg-purple-100 text-purple-700 text-xs px-2.5 py-1 rounded-full">🧠 Prior context used</span>'
                    : '',
                data.manual_review
                    ? '<span class="bg-orange-100 text-orange-700 text-xs px-2.5 py-1 rounded-full">⚠ Manual review needed</span>'
                    : '',
                data.status === 'low_context'
                    ? '<span class="bg-sky-100 text-sky-700 text-xs px-2.5 py-1 rounded-full">💬 AI skipped — low context</span>'
                    : '',
            ].filter(Boolean).join('');

            panel.innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border ${cfg.border} p-6 space-y-5">

                    ${renderPipelineTrace(getPipelineStages(data.status))}

                    <!-- Tier + Score -->
                    <div class="${cfg.bg} border ${cfg.border} rounded-lg p-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xl font-bold ${cfg.text}">${cfg.emoji} ${esc(tier)}</span>
                            <span class="${cfg.text}">
                                <span class="text-3xl font-bold">${esc(score)}</span>
                                <span class="text-sm font-normal"> / 100</span>
                            </span>
                        </div>
                        <div class="bg-white bg-opacity-60 rounded-full h-2 overflow-hidden">
                            <div class="${cfg.bar} h-2 rounded-full transition-all duration-700"
                                 style="width: ${Math.max(2, score)}%"></div>
                        </div>
                    </div>

                    <!-- Intent summary -->
                    <div>
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-1.5">Intent Summary</div>
                        <p class="text-slate-800 text-sm leading-relaxed">${esc(data.intent_summary)}</p>
                    </div>

                    <!-- Suggested opener -->
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <div class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Suggested Opener</div>
                            <button id="copy-btn" onclick="copyOpener()"
                                    class="text-xs text-blue-500 hover:text-blue-700 font-medium transition-colors">
                                Copy
                            </button>
                        </div>
                        <div id="opener-text"
                             class="bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-700 italic leading-relaxed">
                            "${esc(data.suggested_opener)}"
                        </div>
                    </div>

                    ${redFlagsHtml}

                    ${badges ? `<div class="flex flex-wrap gap-2 pt-3 border-t border-slate-100">${badges}</div>` : ''}
                </div>`;

            // Store the plain opener text for the copy button
            window._currentOpener = data.suggested_opener ?? '';
        }

        function renderNetworkError(message) {
            document.getElementById('result-panel').innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-red-200 p-10 flex flex-col items-center justify-center text-center">
                    <div class="text-4xl mb-3">🔌</div>
                    <div class="font-semibold text-red-800">Connection Error</div>
                    <div class="text-red-600 text-sm mt-1">${esc(message)}</div>
                    <p class="text-slate-400 text-xs mt-4">Is the server running? Try <code class="bg-slate-100 px-1 rounded">docker compose up</code></p>
                </div>`;
        }

        // ── Copy suggested opener to clipboard ────────────────────────────────

        function copyOpener() {
            if (!window._currentOpener) return;
            navigator.clipboard.writeText(window._currentOpener).then(() => {
                const btn = document.getElementById('copy-btn');
                if (!btn) return;
                btn.textContent = 'Copied ✓';
                btn.classList.replace('text-blue-500', 'text-emerald-600');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.replace('text-emerald-600', 'text-blue-500');
                }, 1800);
            });
        }
    </script>

</body>
</html>
