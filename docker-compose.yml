services:

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount your Google service account credentials file (read-only)
      - ./google_credentials.json:/app/google_credentials.json:ro
    depends_on:
      qdrant:
        condition: service_healthy
    restart: on-failure

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      # Named volume so lead memory persists across container restarts
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  qdrant_storage:
